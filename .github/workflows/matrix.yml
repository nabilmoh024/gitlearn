name: 09 - Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  greet:
    strategy:
      matrix:
        environment: [dev, prod]

    runs-on: ubuntu-24.04

    env:
      MESSAGE: "Welcome to GitHub Actions"

    steps:
      - name: Print variable
        run: echo "$MESSAGE"

      - name: Print environment
        run: echo "This is ${{ matrix.environment }}"

      # IF condition
      - name: If DEV
        if: matrix.environment == 'dev'
        run: echo "This is DEV environment"

      # ELSE condition
      - name: Else PROD
        if: matrix.environment != 'dev'
        run: echo "This is PROD environment"